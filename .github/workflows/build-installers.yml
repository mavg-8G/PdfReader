name: Build and release Windows installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSI (${{ matrix.platform }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Read installer version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content Instalador/Package.appxmanifest
          $version = [version]$manifest.Package.Identity.Version
          "FOLIO_VERSION=$($version.Major).$($version.Minor).$($version.Build)" >> $env:GITHUB_ENV
      - name: Run core tests
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Platform ${{ matrix.platform }} -Version $env:FOLIO_VERSION
      - name: Stage installer for release
        uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ env.FOLIO_VERSION }}-${{ matrix.platform }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    permissions:
      contents: write
    concurrency:
      group: folio-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Folio-*
          path: release-assets
          merge-multiple: true
      - name: Publish all installers in one release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$manifest = Get-Content Instalador/Package.appxmanifest
          $version = [version]$manifest.Package.Identity.Version
          $versionText = "$($version.Major).$($version.Minor).$($version.Build)"
          $tag = "v$versionText"
          $names = @('x86', 'x64', 'arm64') | ForEach-Object { "Folio-$versionText-$_.msi" }
          $names += @('x86', 'x64', 'arm64') | ForEach-Object { "Folio-$versionText-$_.msi.sha256" }
          $assets = @($names | ForEach-Object { Join-Path 'release-assets' $_ })
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }

          $publishedAssets = @(gh release view $tag --json assets --jq '.assets[].name' 2>$null)
          if ($LASTEXITCODE -eq 0) {
            foreach ($name in $names) {
              if ($publishedAssets -notcontains $name) { throw "Release $tag exists but is missing $name" }
            }
            Write-Host "Release $tag already contains all three installers. Bump Package.appxmanifest for a new release."
            exit 0
          }

          gh release create $tag @assets --target $env:GITHUB_SHA --title "Folio $tag" --notes "Windows MSI installers for x86, x64 and ARM64. These installers are unsigned."
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag" }
