<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' https://folio-document.invalid; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Folio document canvas</title>
  <link rel="stylesheet" href="vendor/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="viewerContainer" tabindex="0" role="region" aria-label="PDF document. Select text to copy. Use Page Up and Page Down to navigate.">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <aside id="ocrPanel" aria-labelledby="ocrHeading" hidden>
    <div class="ocr-header"><h2 id="ocrHeading">Read scanned page</h2><button id="ocrClose" aria-label="Close scanned-page reader">&#x2715;</button></div>
    <p>Extract text from a photo or scan, one page at a time. Everything stays on this device.</p>
    <div class="ocr-actions">
      <label for="ocrLanguage">Language</label>
      <select id="ocrLanguage"><option value="eng">English</option><option value="spa">Español</option></select>
      <button id="ocrRead">Read page</button><button id="ocrCancel" hidden>Cancel</button>
    </div>
    <progress id="ocrProgress" max="100" aria-label="Text recognition progress" hidden></progress>
    <p id="ocrStatus" role="status" aria-live="polite"></p>
    <label for="ocrText">Recognized text</label>
    <textarea id="ocrText" readonly spellcheck="false" placeholder="Text from this page will appear here."></textarea>
    <div class="ocr-actions"><button id="ocrSelect">Select all text</button><span>Ctrl+C to copy</span></div>
    <label for="ocrSearch">Find in recognized text</label>
    <div class="ocr-actions"><input id="ocrSearch" type="search" maxlength="500" placeholder="Find on this page…"><button id="ocrFind">Next</button></div>
    <span id="ocrMatch" role="status"></span>
    <p class="ocr-note">OCR may make mistakes. This text is temporary; it isn’t added to the PDF or document-wide search.</p>
  </aside>
  <div id="printContainer" aria-hidden="true"></div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <button id="exitPresentation" hidden title="Exit presentation (Escape)">Exit presentation · Esc</button>
  <script type="module" src="viewer.mjs"></script>
</body>
</html>
